app-id: ch.proton.drive
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: proton-drive

finish-args:
  - --share=network
  # Not doing --filesystem=host here. Just use --file-forwarding. Or use your own --filesystem= args.

modules:
  - name: proton-drive-cli
    buildsystem: simple
    build-commands:
      - install -Dm755 proton-drive /app/bin/proton-drive
    build-options:
      # Needed for the Bun single-file executable to work
      no-debuginfo: true
      strip: false
    sources:
      - type: file
        url: https://proton.me/download/drive/cli/0.7.0/linux-x64/proton-drive
        sha512: 5a5affcbec04ea926a32d10e236c1342227f1b6d416cb797f88f943b2c4f1dcf53b5897a115f1c1aa9ce8ce92fd637e1c50bd223b04866577681f0584eccdbc6
        only-arches:
          - x86_64
      - type: file
        url: https://proton.me/download/drive/cli/0.7.0/linux-arm64/proton-drive
        sha512: 73c68017171b57f4e1126b1477dd129a8d8e7189fe42387145fccb4808a3ac1da320ef10d83754364706de80ecc700dd8e04321f0d60c202e20d546f9304efc3
        only-arches:
          - aarch64
