app-id: ch.proton.drive
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

command: proton-drive

finish-args:
  - --share=network
  # Not doing --filesystem=host here. Just use --file-forwarding. Or use your own --filesystem= args.

modules:
  - name: proton-drive-cli
    buildsystem: simple
    build-commands:
      - install -Dm755 proton-drive /app/bin/proton-drive
    build-options:
      # Needed for the Bun single-file executable to work
      no-debuginfo: true
      strip: false
    sources:
      # Check https://proton.me/download/drive/cli/index.html
      - type: file
        url: https://proton.me/download/drive/cli/0.9.0/linux-x64/proton-drive
        sha512: 3533025ba69ae112b64e3e01fbcc1ad0688136a4043f6cf6a72886967d85fdcd9ec235479c2e113171614be5225bfba93427509a05ca5aa6071d924fa7e91ca8
        only-arches:
          - x86_64
      - type: file
        url: https://proton.me/download/drive/cli/0.9.0/linux-arm64/proton-drive
        sha512: c8d5a6b174e57f06d05cb5483400b9963faf58e743b6b33706bb73ecff718047ffce6b439994255b94b5b226b90d2e91bef7418ec96c1c3f5d8bf39b6cd01321
        only-arches:
          - aarch64
