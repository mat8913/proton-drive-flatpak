app-id: ch.proton.drive
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

command: proton-drive

finish-args:
  - --share=network
  # Not doing --filesystem=host here. Just use --file-forwarding. Or use your own --filesystem= args.

modules:
  - name: proton-drive-cli
    buildsystem: simple
    build-commands:
      - install -Dm755 proton-drive /app/bin/proton-drive
    build-options:
      # Needed for the Bun single-file executable to work
      no-debuginfo: true
      strip: false
    sources:
      # Check https://proton.me/download/drive/cli/index.html
      - type: file
        url: https://proton.me/download/drive/cli/0.8.0/linux-x64/proton-drive
        sha512: cf61c2688c45e1055d8add6221d9471a5a5b64bf3bcdb86460f5cb18414596cc4df3cdb6627c9097c94bec32a3c9915ada3211ef2ae5be33c46ebbc996ccaa28
        only-arches:
          - x86_64
      - type: file
        url: https://proton.me/download/drive/cli/0.8.0/linux-arm64/proton-drive
        sha512: 27a1aec1d2095fd4a1a81e1d47cd1f9fd4901bd579ffe50342d15e2e52078d6e8b2dddcf58a4a386438dc7562017778be26c1ba62399f901ae82c7430e2140a3
        only-arches:
          - aarch64
